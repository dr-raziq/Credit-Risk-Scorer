<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Scorer</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
        label { display: block; margin-top: 0.75rem; font-weight: 600; }
        input, select { width: 100%; padding: 0.4rem; margin-top: 0.25rem; }
        button { margin-top: 1rem; padding: 0.6rem 1.2rem; cursor: pointer; }
        pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Credit Risk Scorer</h1>
    <p>Enter loan application details to get a prediction with explanation.</p>
    <form id="form">
        <label>Loan Amount <input type="number" name="loan_amnt" value="15000" required></label>
        <label>Interest Rate (%) <input type="number" step="0.01" name="int_rate" value="12.5" required></label>
        <label>Annual Income <input type="number" name="annual_inc" value="60000" required></label>
        <label>Debt-to-Income Ratio <input type="number" step="0.01" name="dti" value="15.0" required></label>
        <label>FICO Low <input type="number" name="fico_range_low" value="680" required></label>
        <label>FICO High <input type="number" name="fico_range_high" value="684" required></label>
        <label>Employment Length
            <select name="emp_length">
                <option value="10+ years">10+ years</option>
                <option value="5 years">5 years</option>
                <option value="2 years">2 years</option>
                <option value="< 1 year">&lt; 1 year</option>
            </select>
        </label>
        <label>Home Ownership
            <select name="home_ownership">
                <option value="RENT">RENT</option>
                <option value="MORTGAGE">MORTGAGE</option>
                <option value="OWN">OWN</option>
            </select>
        </label>
        <label>Purpose
            <select name="purpose">
                <option value="debt_consolidation">Debt Consolidation</option>
                <option value="credit_card">Credit Card</option>
                <option value="home_improvement">Home Improvement</option>
            </select>
        </label>
        <label>Revolving Utilisation <input type="number" step="0.01" name="revol_util" value="45.0" required></label>
        <label>Total Accounts <input type="number" name="total_acc" value="20" required></label>
        <label>Open Accounts <input type="number" name="open_acc" value="10" required></label>
        <label>Delinquencies (2y) <input type="number" name="delinq_2yrs" value="0" required></label>
        <label>Inquiries (6m) <input type="number" name="inq_last_6mths" value="1" required></label>
        <button type="submit">Score Application</button>
    </form>
    <h2>Result</h2>
    <pre id="result">Submit the form to see the prediction.</pre>

    <script>
        const API_URL = window.location.origin.includes("localhost")
            ? "http://localhost:8000"
            : "https://your-api.onrender.com"; // replace after deployment

        document.getElementById("form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const payload = {};
            for (const el of form.elements) {
                if (el.name) {
                    payload[el.name] = el.type === "number" ? parseFloat(el.value) : el.value;
                }
            }
            const res = await fetch(`${API_URL}/predict`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            document.getElementById("result").textContent = JSON.stringify(data, null, 2);
        });
    </script>
</body>
</html>
